<!DOCTYPE html>
<html>
<head>
    <title>Calculadora con Multiplicación</title>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
            font-family: Arial, sans-serif;
        }
        .content {
            display: inline-block;
            text-align: left;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-container label {
            width: 150px;
            margin-right: 10px;
        }
        .input-container input[type="text"] {
            width: 150px;
            padding: 5px;
        }
        .buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Estilos base para los botones */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Colores específicos */
        .btn-suma { background-color: #28a745; }   /* Verde */
        .btn-resta { background-color: #dc3545; }  /* Rojo */
        .btn-multi { background-color: #007bff; }  /* Azul */

        .btn:hover {
            opacity: 0.85;
        }

        #resultado {
            margin-top: 20px;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            border-top: 1px solid #eee;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h2>Calculadora Interactiva</h2>

        <form>
            <div class="input-container">
                <label for="num1">Primer número:</label>
                <input type="text" id="num1" placeholder="Ej: 8">
            </div>
            <div class="input-container">
                <label for="num2">Segundo número:</label>
                <input type="text" id="num2" placeholder="Ej: 4">
            </div>
            
            <div class="buttons">
                <input type="button" class="btn btn-suma" value="Sumar" onclick="operar('suma')">
                <input type="button" class="btn btn-resta" value="Restar" onclick="operar('resta')">
                <input type="button" class="btn btn-multi" value="Multiplicar" onclick="operar('multi')">
            </div>
        </form>

        <div id="resultado"></div>
    </div>
</div>

<script>
function operar(tipo) {
    // Capturamos los valores actuales
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);
    var divResultado = document.getElementById("resultado");

    if (!isNaN(num1) && !isNaN(num2)) {
        var resultado;
        var operacionTexto;

        // Estructura de control para decidir la operación
        switch(tipo) {
            case 'suma':
                resultado = num1 + num2;
                operacionTexto = "suma";
                break;
            case 'resta':
                resultado = num1 - num2;
                operacionTexto = "resta";
                break;
            case 'multi':
                resultado = num1 * num2;
                operacionTexto = "multiplicación";
                break;
        }

        divResultado.innerHTML = "El resultado de la " + operacionTexto + " es: " + resultado;
        divResultado.style.color = "#333";
    } else {
        divResultado.innerHTML = "⚠️ Por favor, introduce números válidos.";
        divResultado.style.color = "#dc3545";
    }
}
</script>

</body>
</html>
