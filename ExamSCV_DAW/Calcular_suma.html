<!DOCTYPE html>
<html>
<head>
    <title>Calculadora Completa</title>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
            font-family: Arial, sans-serif;
        }
        .content {
            display: inline-block;
            text-align: left;
            background-color: #f9f9f9;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .input-container label {
            width: 130px;
            font-weight: bold;
        }
        .input-container input[type="text"] {
            width: 150px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .buttons {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:active { transform: scale(0.96); }
        .btn:hover { filter: brightness(1.1); }

        /* Colores de botones */
.btn-suma { background-color: #f8f404; color: black; } /* Amarillo */
.btn-resta { background-color: #fe04c8; color: white; } /* Rosa/Fucsia */
.btn-multi { background-color: #0a3007; color: white; } /* Verde Oscuro */
.btn-div { background-color: #ff7300; color: white; }   /* Naranja */

        #resultado {
            margin-top: 25px;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            border-top: 2px solid #eee;
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h2 style="text-align: center;">Calculadora Pro</h2>

        <form>
            <div class="input-container">
                <label for="num1">Número A:</label>
                <input type="text" id="num1" placeholder="0">
            </div>
            <div class="input-container">
                <label for="num2">Número B:</label>
                <input type="text" id="num2" placeholder="0">
            </div>
            
            <div class="buttons">
                <input type="button" class="btn btn-suma" value="Sumar (+)" onclick="operar('suma')">
                <input type="button" class="btn btn-resta" value="Restar (-)" onclick="operar('resta')">
                <input type="button" class="btn btn-multi" value="Multiplicar (×)" onclick="operar('multi')">
                <input type="button" class="btn btn-div" value="Dividir (÷)" onclick="operar('division')">
            </div>
        </form>

        <div id="resultado"></div>
    </div>
</div>

<script>
function operar(tipo) {
    const n1 = parseFloat(document.getElementById("num1").value);
    const n2 = parseFloat(document.getElementById("num2").value);
    const resDiv = document.getElementById("resultado");

    if (isNaN(n1) || isNaN(n2)) {
        resDiv.innerHTML = "⚠️ Introduce números válidos";
        resDiv.style.color = "#dc3545";
        return;
    }

    let resultado;
    let simbolo;

    switch(tipo) {
        case 'suma':
            resultado = n1 + n2;
            simbolo = "+";
            break;
        case 'resta':
            resultado = n1 - n2;
            simbolo = "-";
            break;
        case 'multi':
            resultado = n1 * n2;
            simbolo = "×";
            break;
        case 'division':
            if (n2 === 0) {
                resDiv.innerHTML = "❌ No se puede dividir por cero";
                resDiv.style.color = "#dc3545";
                return;
            }
            resultado = n1 / n2;
            simbolo = "÷";
            break;
    }

    // Formateo del resultado para que no tenga demasiados decimales si es necesario
    const resultadoFormateado = Number.isInteger(resultado) ? resultado : resultado.toFixed(2);
    
    resDiv.innerHTML = `${n1} ${simbolo} ${n2} = ${resultadoFormateado}`;
    resDiv.style.color = "#333";
}
</script>

</body>
</html>
