<!DOCTYPE html>
<html>
<head>
    <title>Calculadora Simple</title>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
        }
        .content {
            display: inline-block;
            text-align: left;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-container label {
            width: 150px;
            margin-right: 10px;
        }
        .input-container input[type="text"] {
            width: 150px;
        }
        .buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        #resultado {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h2>Operaciones Matemáticas</h2>

        <form>
            <div class="input-container">
                <label for="num1">Primer número:</label>
                <input type="text" id="num1">
            </div>
            <div class="input-container">
                <label for="num2">Segundo número:</label>
                <input type="text" id="num2">
            </div>
            
            <div class="buttons">
                <input type="button" value="Calcular Suma" onclick="operar('suma')">
                <input type="button" value="Calcular Resta" onclick="operar('resta')">
            </div>
        </form>

        <div id="resultado"></div>
    </div>
</div>

<script>
function operar(tipo) {
    // Obtener los valores de los campos de entrada
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);
    var divResultado = document.getElementById("resultado");

    // Verificar si ambos valores son números válidos
    if (!isNaN(num1) && !isNaN(num2)) {
        var resultado;
        var operacionTexto;

        if (tipo === 'suma') {
            resultado = num1 + num2;
            operacionTexto = "suma";
        } else if (tipo === 'resta') {
            resultado = num1 - num2;
            operacionTexto = "resta";
        }

        // Mostrar el resultado
        divResultado.innerHTML = "El resultado de la " + operacionTexto + " es: " + resultado;
    } else {
        // Mostrar un mensaje de error si los valores no son números
        divResultado.innerHTML = "Por favor, ingrese dos números válidos.";
    }
}
</script>

</body>
</html>
