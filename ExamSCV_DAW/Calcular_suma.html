<!DOCTYPE html>
<html>
<head>
    <title>Calculadora con Colores</title>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
            font-family: Arial, sans-serif;
        }
        .content {
            display: inline-block;
            text-align: left;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-container label {
            width: 150px;
            margin-right: 10px;
        }
        .input-container input[type="text"] {
            width: 150px;
            padding: 5px;
        }
        .buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Estilos para los botones */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-suma {
            background-color: #28a745; /* Verde */
        }

        .btn-resta {
            background-color: #dc3545; /* Rojo */
        }

        .btn:hover {
            opacity: 0.8;
        }

        #resultado {
            margin-top: 20px;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h2>Operaciones Matemáticas</h2>

        <form>
            <div class="input-container">
                <label for="num1">Primer número:</label>
                <input type="text" id="num1" placeholder="Ej: 10">
            </div>
            <div class="input-container">
                <label for="num2">Segundo número:</label>
                <input type="text" id="num2" placeholder="Ej: 5">
            </div>
            
            <div class="buttons">
                <input type="button" class="btn btn-suma" value="Calcular Suma" onclick="operar('suma')">
                <input type="button" class="btn btn-resta" value="Calcular Resta" onclick="operar('resta')">
            </div>
        </form>

        <div id="resultado"></div>
    </div>
</div>

<script>
function operar(tipo) {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);
    var divResultado = document.getElementById("resultado");

    if (!isNaN(num1) && !isNaN(num2)) {
        var resultado;
        var operacionTexto;

        if (tipo === 'suma') {
            resultado = num1 + num2;
            operacionTexto = "suma";
        } else if (tipo === 'resta') {
            resultado = num1 - num2;
            operacionTexto = "resta";
        }

        divResultado.innerHTML = "El resultado de la " + operacionTexto + " es: " + resultado;
        divResultado.style.color = "#333";
    } else {
        divResultado.innerHTML = "Por favor, ingrese números válidos.";
        divResultado.style.color = "red";
    }
}
</script>

</body>
</html>
