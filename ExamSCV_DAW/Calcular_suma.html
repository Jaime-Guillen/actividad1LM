<!DOCTYPE html>
<html>
<head>
    <title>Calculadora: División</title>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
            font-family: Arial, sans-serif;
        }
        .content {
            display: inline-block;
            text-align: left;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-container label {
            width: 150px;
            margin-right: 10px;
        }
        .input-container input[type="text"] {
            width: 150px;
            padding: 5px;
        }
        .buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active { transform: scale(0.95); }
        .btn:hover { opacity: 0.85; }

        /* Colores */
        .btn-suma { background-color: #28a745; }   /* Verde */
        .btn-resta { background-color: #dc3545; }  /* Rojo */
        .btn-div { background-color: #6f42c1; }    /* Púrpura */

        #resultado {
            margin-top: 20px;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="content">
        <h2>Calculadora con División</h2>

        <form>
            <div class="input-container">
                <label for="num1">Primer número:</label>
                <input type="text" id="num1">
            </div>
            <div class="input-container">
                <label for="num2">Segundo número:</label>
                <input type="text" id="num2">
            </div>
            
            <div class="buttons">
                <input type="button" class="btn btn-suma" value="Sumar" onclick="operar('suma')">
                <input type="button" class="btn btn-resta" value="Restar" onclick="operar('resta')">
                <input type="button" class="btn btn-div" value="Dividir" onclick="operar('division')">
            </div>
        </form>

        <div id="resultado"></div>
    </div>
</div>

<script>
function operar(tipo) {
    var num1 = parseFloat(document.getElementById("num1").value);
    var num2 = parseFloat(document.getElementById("num2").value);
    var divResultado = document.getElementById("resultado");

    if (!isNaN(num1) && !isNaN(num2)) {
        var resultado;
        var operacionTexto;

        switch(tipo) {
            case 'suma':
                resultado = num1 + num2;
                operacionTexto = "suma";
                break;
            case 'resta':
                resultado = num1 - num2;
                operacionTexto = "resta";
                break;
            case 'division':
                // Validación para evitar división por cero
                if (num2 === 0) {
                    divResultado.innerHTML = "❌ Error: No se puede dividir por cero.";
                    divResultado.style.color = "#dc3545";
                    return; // Salimos de la función
                }
                resultado = num1 / num2;
                operacionTexto = "división";
                break;
        }

        divResultado.innerHTML = "El resultado de la " + operacionTexto + " es: " + resultado;
        divResultado.style.color = "#333";
    } else {
        divResultado.innerHTML = "⚠️ Por favor, introduce números válidos.";
        divResultado.style.color = "#dc3545";
    }
}
</script>

</body>
</html>
